<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌈 繽紛顏色挑戰·頭像版</title>
    <style>
        :root { --font: 'Comic Sans MS', 'Microsoft JhengHei', cursive, sans-serif; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font); overflow: hidden; background: #FFF0F5; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        #mode-select { position: fixed; inset: 0; background: linear-gradient(135deg, #FFF5F7, #FCE4EC, #E8F5E9, #FFF9C4); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 20px; }
        #mode-select h1 { font-size: clamp(2rem, 6vw, 2.8rem); color: #FF6B6B; text-shadow: 3px 3px 0 #FFCCD5; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        .mode-card-row { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .mode-card { background: white; border-radius: 2rem; padding: 1.8rem 1.2rem; width: 170px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); cursor: pointer; border: 4px dashed #FFCCD5; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: 0.2s; }
        .mode-card:active { transform: scale(0.95); } .mode-card .icon { font-size: 3rem; } .mode-card h3 { font-size: 1.1rem; color: #555; margin: 0; }
        .btn-music { position: fixed; z-index: 10000; width: 44px; height: 44px; border-radius: 50%; font-size: 1.3rem; border: 3px solid #FFCCD5; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; top: 10px; right: 10px; }
        .player-select-panel { position: absolute; inset: 0; background: rgba(255,255,255,0.96); z-index: 1600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; }
        .player-grid { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 95%; }
        .player-card { background: white; border-radius: 50%; width: 65px; height: 65px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); cursor: pointer; border: 3px solid #EEE; display: flex; align-items: center; justify-content: center; transition: 0.15s; }
        .player-card.selected { border-color: #FF9800; background: #FFF8E1; }
        .player-card .avatar { font-size: 2rem; }
        .btn { padding: 0.7rem 1.4rem; font-size: 0.9rem; font-weight: bold; border-radius: 2.5rem; border: none; cursor: pointer; margin: 4px; color: white; width: 80%; max-width: 240px; font-family: var(--font); box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
        .btn:active { transform: translateY(3px); box-shadow: none; } .btn-s { background: #66BB6A; } .btn-h { background: #FF9800; } .btn-back { background: #90A4AE; }
        .game-header { position: absolute; top: 0; width: 100%; height: 55px; background: white; display: none; z-index: 2000; border-bottom: 3px solid #FFCCD5; align-items: center; justify-content: center; }
        .timer-val { font-size: 1rem; font-weight: bold; color: #FF6B6B; background: #FFF5F7; padding: 3px 12px; border-radius: 20px; border: 2px solid #FFCCD5; }
        .game-container { display: none; width: 100vw; height: 100vh; flex-direction: row; gap: 2px; }
        .game-panel { flex:1; position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: 15px 15px 0 0; }
        .drop-grid { flex:1; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 8px; padding: 6px; }
        .belly { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; color: white; border: 4px solid rgba(255,255,255,0.9); box-shadow: 0 3px 10px rgba(0,0,0,0.1); animation: float 3s infinite; text-shadow: 0 2px 3px rgba(0,0,0,0.2); }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        .belly.success-anim { animation: bellySuccess 0.4s ease-out; }
        .belly.error-anim { animation: bellyError 0.3s ease-out; }
        @keyframes bellySuccess { 0% { transform: scale(1); } 50% { transform: scale(1.2); } }
        @keyframes bellyError { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .ball-pit { height: 100px; background: rgba(255,255,255,0.4); border-top: 2px dashed #FFCCD5; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; padding: 6px; position: relative; }
        .ball-pit::before { content: '👇拖放👇'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 7px; color: #BBB; pointer-events: none; }
        .ball { width: 40px; height: 40px; border-radius: 50%; border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.1); cursor: pointer; touch-action: none; z-index: 10; background: #ddd; }
        .ball.dragging { z-index: 1000; transform: scale(1.15); }
        .ball.success-anim { animation: ballDisappear 0.25s forwards; }
        .ball.error-anim { animation: ballShake 0.4s ease-out; }
        @keyframes ballDisappear { to { transform: scale(0); opacity: 0; } }
        @keyframes ballShake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } }
        .feedback-wrapper { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; pointer-events: none; }
        .feedback-emoji { font-size: 2.5rem; } .feedback-text { font-size: 0.8rem; font-weight: bold; margin-top: 2px; background: rgba(255,255,255,0.9); padding: 2px 8px; border-radius: 12px; }
        .challenge-banner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #FF6B6B; color: white; padding: 6px 12px; border-radius: 15px; font-weight: bold; z-index: 1500; pointer-events: none; font-size: 0.7rem; }
        .waiting-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #FF9800; font-size: 0.9rem; }
        .player-label { padding: 2px 5px; text-align: center; font-weight: bold; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        .score-tag { font-size: 0.5rem; }
        @media (max-width: 480px) { .belly { width: 55px; height: 55px; font-size: 0.8rem; } .ball { width: 32px; height: 32px; } .player-card { width: 55px; height: 55px; } .player-card .avatar { font-size: 1.5rem; } }
    </style>
</head>
<body>
<button class="btn-music" id="btnMusic">🎵</button>

<div id="mode-select">
    <h1>🌈 繽紛顏色挑戰</h1>
    <div class="mode-card-row">
        <div class="mode-card" id="btnSoloMode"><div class="icon">🧑‍🎨</div><h3>單人模式</h3></div>
        <div class="mode-card" id="btnDualMode"><div class="icon">👫</div><h3>雙人模式</h3></div>
        <div class="mode-card" style="border-color:#FF8A65;" id="btnFourMode"><div class="icon">👨‍👩‍👧‍👦</div><h3>四人對戰</h3></div>
    </div>
</div>

<div id="game-header" class="game-header"><span class="timer-val">⏱️ <span id="game-timer">60</span>s</span></div>
<div id="game-container" class="game-container"></div>

<script>
(function() {
    const allPlayers = [
        { name: 'Ali', avatar: '🦁' }, { name: '張杄熒', avatar: '🐱' }, { name: '徐晉恆', avatar: '🐶' },
        { name: '徐浚宏', avatar: '🐼' }, { name: '何宙高', avatar: '🐨' }, { name: '吳柏賢', avatar: '🐸' },
        { name: '黃子康', avatar: '🐵' }, { name: '陳樂宏', avatar: '🐬' }, { name: 'Subeeta', avatar: '🦊' },
        { name: '陳梓晨', avatar: '🐰' }
    ];
    const baseColors = [ { n: '紅', v: '#FF5252' }, { n: '黃', v: '#FFD740' }, { n: '藍', v: '#448AFF' }, { n: '綠', v: '#69F0AE' } ];
    const advancedColors = [...baseColors, { n: '橙', v: '#FF9100' }];

    // 音頻
    let audioCtx, musicGain, musicNodes = [], musicPlaying = false;
    function getCtx() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
    function stopMusic() { musicPlaying = false; musicNodes.forEach(o => { try { o.stop(); } catch(e) {} }); musicNodes = []; if (musicGain) { musicGain.disconnect(); musicGain = null; } document.getElementById('btnMusic').textContent = '🔇'; }
    function startMusic() { stopMusic(); const ctx = getCtx(); musicGain = ctx.createGain(); musicGain.gain.value = 0.12; musicGain.connect(ctx.destination); const melody = [262,294,330,349,392,349,330,294, 262,330,392,523, 392,330,294,262]; const dur = 0.35; function playMelody(start) { melody.forEach((f,i) => { const o = ctx.createOscillator(); o.type='triangle'; o.frequency.value=f; o.connect(musicGain); o.start(start+i*dur); o.stop(start+i*dur+dur-0.04); musicNodes.push(o); }); } playMelody(ctx.currentTime); const loopDuration = melody.length*dur*1000; function loop() { if (!musicPlaying) return; playMelody(ctx.currentTime+0.1); setTimeout(loop, loopDuration-100); } setTimeout(loop, loopDuration-200); musicPlaying = true; document.getElementById('btnMusic').textContent = '🎵'; }
    function sfx(t) { try { const ctx = getCtx(), now = ctx.currentTime; if (t==='win') { [523,659,784].forEach((f,i) => { const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g);g.connect(ctx.destination);o.type='triangle';o.frequency.setValueAtTime(f,now+i*0.1);g.gain.setValueAtTime(0.3,now+i*0.1);g.gain.exponentialRampToValueAtTime(0.01,now+i*0.1+0.2);o.start(now+i*0.1);o.stop(now+i*0.1+0.25); }); return; } const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g);g.connect(ctx.destination); if (t==='ok') { o.type='sine';o.frequency.setValueAtTime(523,now);o.frequency.exponentialRampToValueAtTime(880,now+0.12); g.gain.setValueAtTime(0.35,now);g.gain.exponentialRampToValueAtTime(0.01,now+0.25); } else { o.type='square';o.frequency.setValueAtTime(220,now);o.frequency.linearRampToValueAtTime(110,now+0.2); g.gain.setValueAtTime(0.25,now);g.gain.exponentialRampToValueAtTime(0.01,now+0.3); } o.start(now);o.stop(now+0.35); } catch(e){} }
    document.getElementById('btnMusic').addEventListener('click', () => { if (musicPlaying) stopMusic(); else startMusic(); });

    function getPlayersByMode(m) { const e=['黃子康','Ali','何宙高','陳樂宏','張杄熒']; const h=['吳柏賢','Subeeta','陳梓晨','徐浚宏','徐晉恆']; return allPlayers.filter(p=>(m==='s'?e:h).includes(p.name)); }
    function pickRandom(arr,n) { return [...arr].sort(()=>Math.random()-0.5).slice(0,n); }
    function getColorsForGame(mode, isChallenge) { return mode==='s'? (isChallenge?pickRandom(baseColors,3):pickRandom(baseColors,2)) : (isChallenge?advancedColors:baseColors); }

    function buildPlayerGrid(id, players, cb) {
        const g=document.getElementById(id); if(!g)return; g.innerHTML='';
        players.forEach(p=>{
            const c=document.createElement('div'); c.className='player-card';
            c.innerHTML=`<div class="avatar">${p.avatar}</div>`;
            c.addEventListener('click',(e)=>{e.stopPropagation();cb(p,c);});
            g.appendChild(c);
        });
    }

    function showFeedback(container, emoji, text, color) {
        if(!container)return; const old=container.querySelector('.feedback-wrapper'); if(old)old.remove();
        const w=document.createElement('div'); w.className='feedback-wrapper';
        w.innerHTML=`<div style="font-size:2.5rem;color:${color}">${emoji}</div><div style="font-size:0.8rem;background:white;padding:2px 8px;border-radius:12px;color:${color}">${text}</div>`;
        container.appendChild(w); setTimeout(()=>w.remove(),500);
    }

    function attachDrag(el, container, gs) {
        let startX, startY, isDragging = false, pointerId = null;
        const onStart = (e) => { if (timeLeft <= 0 || gs.fin) return; if (isDragging) return; e.preventDefault(); const pt = e.touches ? e.changedTouches[0] : e; if (!pt) return; isDragging = true; pointerId = e.touches ? pt.identifier : 'mouse'; startX = pt.clientX; startY = pt.clientY; el.classList.add('dragging'); el.style.transition='none'; el.style.zIndex=1000; };
        const onMove = (e) => { if (!isDragging) return; e.preventDefault(); let pt = null; if (e.touches) { for (let i=0;i<e.touches.length;i++) if (e.touches[i].identifier===pointerId) { pt=e.touches[i]; break; } if (!pt) return; } else pt = e; el.style.transform = `translate(${pt.clientX-startX}px, ${pt.clientY-startY}px) scale(1.15)`; };
        const onEnd = (e) => { if (!isDragging) return; if (e.changedTouches) { let found=false; for (let i=0;i<e.changedTouches.length;i++) if (e.changedTouches[i].identifier===pointerId) { found=true; break; } if (!found) return; } isDragging = false; el.classList.remove('dragging'); el.style.zIndex=10; const ballRect = el.getBoundingClientRect(); let hit = null; container.querySelectorAll('.belly').forEach(belly => { const r = belly.getBoundingClientRect(); const ox = Math.max(0, Math.min(ballRect.right,r.right)-Math.max(ballRect.left,r.left)); const oy = Math.max(0, Math.min(ballRect.bottom,r.bottom)-Math.max(ballRect.top,r.top)); if (ox*oy > ballRect.width*ballRect.height*0.3) hit = belly; }); if (hit) { if (hit.dataset.v === el.dataset.v) { sfx('ok'); hit.classList.add('success-anim'); el.classList.add('success-anim'); showFeedback(container, '✅', '答對了！', '#4CAF50'); setTimeout(()=>hit.classList.remove('success-anim'),400); cleanup(); setTimeout(()=>{ if(el.parentNode)el.remove(); checkLevelComplete(gs); },200); } else { sfx('no'); hit.classList.add('error-anim'); el.classList.add('error-anim'); showFeedback(container, '❌', '再試試', '#F44336'); setTimeout(()=>hit.classList.remove('error-anim'),350); setTimeout(()=>el.classList.remove('error-anim'),400); gs.errors++; resetPos(); } } else resetPos(); };
        const resetPos = () => { el.style.transition='transform 0.3s'; el.style.transform='translate(0,0)'; };
        const cleanup = () => { el.removeEventListener('touchstart',onStart); el.removeEventListener('mousedown',onStart); if(container){ container.removeEventListener('touchmove',onMove); container.removeEventListener('mousemove',onMove); container.removeEventListener('touchend',onEnd); container.removeEventListener('mouseup',onEnd); } };
        el.addEventListener('touchstart',onStart,{passive:false}); el.addEventListener('mousedown',onStart);
        if(container){ container.addEventListener('touchmove',onMove,{passive:false}); container.addEventListener('mousemove',onMove); container.addEventListener('touchend',onEnd); container.addEventListener('mouseup',onEnd); }
    }

    const CHALLENGE_TRIGGER_SOLO = 10;
    const CHALLENGE_TRIGGER_DUAL = 5;
    const CHALLENGE_TRIGGER_FOUR = 3;
    let gameStates = [], timeLeft = 60, timerOn = false, timerInterval = null;
    let currentMode = null, dualReady = {};

    function generateColorLevel(gs, grid, pit, container) {
        const colorSet = gs.mode==='inf' ? (gs.inChallenge?getColorsForGame(gs.diff,true):getColorsForGame(gs.diff,false)) : getColorsForGame(gs.mode, gs.inChallenge);
        const numBelly = colorSet.length; const numBall = numBelly + 1;
        const cur = pickRandom(colorSet, numBelly);
        cur.forEach(c => { const d=document.createElement('div'); d.className='belly'; d.dataset.v=c.v; d.style.background=c.v; d.textContent=c.n; grid.appendChild(d); });
        const balls = []; for (let i=0;i<numBall;i++) balls.push(cur[i%cur.length]); balls.sort(()=>Math.random()-0.5);
        balls.forEach(c => { const b=document.createElement('div'); b.className='ball'; b.style.background=c.v; b.dataset.v=c.v; pit.appendChild(b); attachDrag(b, container, gs); });
    }

    function loadLevel(idx) {
        const gs=gameStates[idx]; if(gs.fin||timeLeft<=0) return;
        const grid=document.getElementById('grid-'+idx), pit=document.getElementById('pit-'+idx);
        const container=document.getElementById('game-'+idx);
        grid.innerHTML=''; pit.innerHTML='';
        generateColorLevel(gs, grid, pit, container);
    }

    function getTriggerForMode(mode) {
        if (mode === 'inf') return CHALLENGE_TRIGGER_SOLO;
        if (mode === 'dual') return CHALLENGE_TRIGGER_DUAL;
        return CHALLENGE_TRIGGER_FOUR;
    }

    function checkLevelComplete(gs) {
        const idx=gameStates.indexOf(gs);
        if (!document.querySelector(`#game-${idx} .ball`)) {
            gs.s++;
            if(gs.mode!=='inf') document.getElementById('label-'+idx).querySelector('.score-tag').textContent=`🔄${gs.s} ❌${gs.errors}`;
            const trigger=getTriggerForMode(gs.mode==='inf'?'inf':(gameStates.length===2?'dual':'four'));
            if(gs.s===trigger && !gs.inChallenge) {
                gs.inChallenge=true;
                if(gs.mode==='inf'||timeLeft>0) setTimeout(()=>loadLevel(idx),1500);
                else gs.fin=true;
            } else {
                if(gs.mode==='inf'||timeLeft>0) setTimeout(()=>loadLevel(idx),300);
                else gs.fin=true;
            }
            if(gs.mode==='inf') document.getElementById('label-'+idx).querySelector('.score-tag').textContent=`🔄${gs.s} ❌${gs.errors}`;
            if(gs.mode!=='inf' && gs.fin) showResult(idx);
        }
    }

    function startClock() { if(timerOn) return; timerOn=true; timerInterval=setInterval(()=>{ timeLeft--; document.getElementById('game-timer').textContent=timeLeft; document.getElementById('game-timer').style.color=timeLeft<=10?'#F44336':(timeLeft<=20?'#FF9800':'#FF6B6B'); if(timeLeft<=0){clearInterval(timerInterval); finishAll();} },1000); }
    function finishAll() { gameStates.forEach((gs,i)=>{ if(!gs.fin){gs.fin=true; if(gs.mode!=='inf') showResult(i);} }); }
    function showResult(idx) {
        const gs=gameStates[idx]; if(!gs.player) return;
        const panel=document.getElementById('game-'+idx);
        panel.innerHTML=`<div class="player-select-panel"><div style="font-size:2rem;">🏆</div><h3>${gs.player.avatar}</h3><p>📊 完成 ${gs.s} 題 | ❌ 錯誤 ${gs.errors} 次</p><button class="btn btn-back" id="back-${idx}">↩ 返回</button></div>`;
        document.getElementById('back-'+idx).addEventListener('click', backToModeSelect);
    }

    function buildGamePanels(count) {
        const container=document.getElementById('game-container'); container.innerHTML='';
        const colors=['#E3F2FD','#FFF9C4','#F3E5F5','#E8F5E9'];
        for (let i=0;i<count;i++) {
            const panel=document.createElement('div'); panel.className='game-panel'; panel.style.background=colors[i%4];
            panel.innerHTML=`<div id="select-${i}" class="player-select-panel"></div><div id="game-${i}" style="display:none;flex:1;flex-direction:column;"><div class="player-label" id="label-${i}"></div><div id="grid-${i}" class="drop-grid"></div><div id="pit-${i}" class="ball-pit"></div></div>`;
            container.appendChild(panel);
        }
    }

    function hideMain() { document.getElementById('mode-select').style.display='none'; }
    function showGameUI() { document.getElementById('game-header').style.display='flex'; document.getElementById('game-container').style.display='flex'; }

    // 單人
    function startSoloMode() { currentMode='single'; timeLeft=9999; if(timerInterval){clearInterval(timerInterval);} buildGamePanels(1); hideMain(); showGameUI(); gameStates=[{s:0,errors:0,mode:'inf',diff:'s',fin:false,player:null,inChallenge:false}]; document.getElementById('game-timer').textContent='∞'; document.getElementById('game-timer').style.color='#4CAF50'; showSoloDifficulty(); }
    function showSoloDifficulty() { document.getElementById('select-0').innerHTML=`<div class="player-select-panel"><h3>🎯 選擇難度</h3><button class="btn btn-s" id="sEasy">🌟 簡單</button><button class="btn btn-h" id="sHard">🔥 進階</button><button class="btn btn-back" id="sBack">↩ 返回</button></div>`; document.getElementById('sEasy').addEventListener('click',()=>{ gameStates[0].diff='s'; showSoloPlayerSelect('s'); }); document.getElementById('sHard').addEventListener('click',()=>{ gameStates[0].diff='h'; showSoloPlayerSelect('h'); }); document.getElementById('sBack').addEventListener('click',backToModeSelect); }
    function showSoloPlayerSelect(mode) { const players=getPlayersByMode(mode); document.getElementById('select-0').innerHTML=`<div class="player-select-panel"><h3>👤 選擇頭像</h3><div class="player-grid" id="soloGrid"></div><button class="btn btn-back" id="sBack2">↩ 返回</button></div>`; buildPlayerGrid('soloGrid',players,(player)=>{ gameStates[0].player=player; startSoloGame(); }); document.getElementById('sBack2').addEventListener('click',showSoloDifficulty); }
    function startSoloGame() { document.getElementById('select-0').style.display='none'; document.getElementById('game-0').style.display='flex'; document.getElementById('label-0').innerHTML=`${gameStates[0].player.avatar} <span class="score-tag">🔄0 ❌0</span>`; loadLevel(0); if(!musicPlaying) startMusic(); }

    // 雙人
    function startDualMode() { currentMode='dual'; timeLeft=60; if(timerInterval){clearInterval(timerInterval);} buildGamePanels(2); hideMain(); showGameUI(); gameStates=[{s:0,errors:0,mode:'s',fin:false,player:null,inChallenge:false},{s:0,errors:0,mode:'s',fin:false,player:null,inChallenge:false}]; document.getElementById('game-timer').textContent='60'; showDualDifficulty(); }
    function showDualDifficulty() { const overlay=document.createElement('div'); overlay.className='player-select-panel'; overlay.style.position='fixed'; overlay.style.zIndex='3000'; overlay.innerHTML=`<h3>🎯 選擇難度</h3><p>雙人同步難度</p><button class="btn btn-s" id="dEasy">🌟 簡單</button><button class="btn btn-h" id="dHard">🔥 進階</button><button class="btn btn-back" id="dBack">↩ 返回</button>`; document.body.appendChild(overlay); document.getElementById('dEasy').addEventListener('click',()=>{ overlay.remove(); gameStates[0].mode='s'; gameStates[1].mode='s'; startDualPlayerSelect('s'); }); document.getElementById('dHard').addEventListener('click',()=>{ overlay.remove(); gameStates[0].mode='h'; gameStates[1].mode='h'; startDualPlayerSelect('h'); }); document.getElementById('dBack').addEventListener('click',()=>{ overlay.remove(); backToModeSelect(); }); }
    function startDualPlayerSelect(mode) { const players=getPlayersByMode(mode); [0,1].forEach(i=>{ document.getElementById('select-'+i).style.display='flex'; document.getElementById('select-'+i).innerHTML=`<div class="player-select-panel"><h3>${i===0?'🦁 左邊':'🐬 右邊'}頭像</h3><div class="player-grid" id="dualGrid${i}"></div></div>`; buildPlayerGrid('dualGrid'+i,players,(player,card)=>{ if(dualReady[i]) return; dualReady[i]=true; gameStates[i].player=player; const cont=document.getElementById('select-'+i); cont.querySelectorAll('.player-card').forEach(c=>c.classList.remove('selected')); card.classList.add('selected'); cont.innerHTML=`<div class="waiting-screen">${player.avatar}<br>⏳ 等待...</div>`; if(dualReady[0] && dualReady[1]) setTimeout(startDualGame,500); }); }); }
    function startDualGame() { [0,1].forEach(i=>{ document.getElementById('select-'+i).style.display='none'; document.getElementById('game-'+i).style.display='flex'; document.getElementById('label-'+i).innerHTML=`${gameStates[i].player.avatar} <span class="score-tag">🔄0 ❌0</span>`; loadLevel(i); }); startClock(); if(!musicPlaying) startMusic(); }

    // 四人
    function startFourMode() { currentMode='four'; timeLeft=60; if(timerInterval){clearInterval(timerInterval);} buildGamePanels(4); hideMain(); showGameUI(); gameStates=[{s:0,errors:0,mode:'s',fin:false,player:null,inChallenge:false},{s:0,errors:0,mode:'s',fin:false,player:null,inChallenge:false},{s:0,errors:0,mode:'h',fin:false,player:null,inChallenge:false},{s:0,errors:0,mode:'h',fin:false,player:null,inChallenge:false}]; document.getElementById('game-timer').textContent='60'; const ready=[false,false,false,false]; [0,1,2,3].forEach(i=>{ document.getElementById('select-'+i).style.display='flex'; const players=getPlayersByMode(gameStates[i].mode); document.getElementById('select-'+i).innerHTML=`<div class="player-select-panel"><h3>${i<2?'🟢簡單':'🟠進階'} ${(i%2)+1}</h3><div class="player-grid" id="fourGrid${i}"></div></div>`; buildPlayerGrid('fourGrid'+i,players,(player,card)=>{ if(ready[i]) return; ready[i]=true; gameStates[i].player=player; const cont=document.getElementById('select-'+i); cont.querySelectorAll('.player-card').forEach(c=>c.classList.remove('selected')); card.classList.add('selected'); cont.innerHTML=`<div class="waiting-screen">${player.avatar}<br>⏳ 等待...</div>`; if(ready.every(r=>r)) setTimeout(startFourGame,500); }); }); }
    function startFourGame() { [0,1,2,3].forEach(i=>{ document.getElementById('select-'+i).style.display='none'; document.getElementById('game-'+i).style.display='flex'; document.getElementById('label-'+i).innerHTML=`${gameStates[i].player.avatar} <span class="score-tag">🔄0 ❌0</span>`; loadLevel(i); }); startClock(); if(!musicPlaying) startMusic(); }

    function backToModeSelect() { if(timerInterval){clearInterval(timerInterval);timerInterval=null;} timerOn=false; document.getElementById('game-container').style.display='none'; document.getElementById('game-header').style.display='none'; document.getElementById('mode-select').style.display='flex'; currentMode=null; }

    document.getElementById('btnSoloMode').addEventListener('click', startSoloMode);
    document.getElementById('btnDualMode').addEventListener('click', startDualMode);
    document.getElementById('btnFourMode').addEventListener('click', startFourMode);
    document.getElementById('mode-select').style.display='flex';
})();
</script>
</body>
</html>
