<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>繽紛顏色挑戰 - 單人/雙人模式</title>
    <style>
        :root {
            --bg-L: #E3F2FD;
            --bg-R: #FFF9C4;
            --bg-S: #F3E5F5;
            --font: 'Comic Sans MS', 'Microsoft JhengHei', cursive, sans-serif;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font);
            overflow: hidden; background: #FFEDF0; touch-action: none; user-select: none;
            -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        }
        #mode-select {
            position: fixed; inset: 0; background: linear-gradient(135deg, #FFF5F7 0%, #E8F5E9 50%, #FFF9C4 100%);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; box-sizing: border-box; gap: 20px;
        }
        #mode-select h1 {
            font-size: clamp(24px, 5vw, 38px); color: #FF6B6B; margin: 0;
            text-shadow: 2px 2px 0 rgba(255, 204, 213, 0.6); letter-spacing: 2px;
        }
        #mode-select .mode-subtitle { font-size: 14px; color: #999; margin-top: -10px; }
        .mode-card-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .mode-card {
            background: white; border-radius: 24px; padding: 28px 22px; width: 220px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.25s, box-shadow 0.25s;
            border: 3px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .mode-card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
        .mode-card:active { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
        .mode-card.solo { border-color: #CE93D8; } .mode-card.solo:hover { border-color: #AB47BC; background: #FDF5FF; }
        .mode-card.dual { border-color: #FFCC80; } .mode-card.dual:hover { border-color: #FF9800; background: #FFFDF5; }
        .mode-card .icon { font-size: 64px; } .mode-card h3 { margin: 0; font-size: 20px; color: #444; }
        .mode-card p { margin: 0; font-size: 12px; color: #999; line-height: 1.5; }
        @media (max-width: 500px) {
            .mode-card { width: 150px; padding: 18px 14px; border-radius: 18px; }
            .mode-card .icon { font-size: 44px; } .mode-card h3 { font-size: 16px; } .mode-card p { font-size: 10px; }
            #mode-select h1 { font-size: 22px; }
        }

        #solo-header {
            position: absolute; top: 0; width: 100%; height: 60px; background: white; display: none;
            align-items: center; justify-content: space-between; padding: 0 16px; z-index: 2000;
            border-bottom: 3px solid #E1BEE7; box-shadow: 0 3px 8px rgba(0,0,0,0.06); box-sizing: border-box; gap: 8px; flex-wrap: wrap;
        }
        #solo-header .solo-info { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: bold; color: #555; flex-wrap: wrap; }
        #solo-header .badge { padding: 5px 12px; border-radius: 16px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .badge-easy { background: #C8E6C9; color: #2E7D32; } .badge-hard { background: #FFE0B2; color: #E65100; }
        .badge-challenge { background: #FFCDD2; color: #B71C1C; animation: pulseTag 0.8s infinite ease-in-out; }
        #solo-header .btn-end {
            padding: 8px 18px; font-size: 13px; font-weight: bold; border-radius: 20px; border: none;
            cursor: pointer; background: #EF5350; color: white; white-space: nowrap; font-family: var(--font);
            transition: 0.15s; box-shadow: 0 3px 0 #C62828;
        }
        #solo-header .btn-end:active { transform: translateY(3px); box-shadow: none; }

        #dual-header {
            position: absolute; top: 0; width: 100%; height: 72px; background: white; display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 2000;
            border-bottom: 4px solid #FFCCD5; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box;
        }
        .timer-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 2px 10px; box-sizing: border-box; justify-content: center; flex-wrap: wrap; }
        .timer-val {
            font-size: 22px; font-weight: bold; color: #FF6B6B; background: #FFF5F7; padding: 4px 16px;
            border-radius: 20px; border: 2px solid #FFCCD5; white-space: nowrap; min-width: 70px; text-align: center;
        }
        .status-tag { font-size: 11px; font-weight: bold; padding: 3px 10px; border-radius: 12px; white-space: nowrap; letter-spacing: 0.5px; animation: pulseTag 1.5s infinite ease-in-out; }
        .status-done { background: #C8E6C9; color: #2E7D32; }
        .status-playing { background: #FFF3E0; color: #E65100; }
        .status-waiting { background: #F5F5F5; color: #999; }
        .status-challenge { background: #FFCDD2; color: #B71C1C; animation: pulseTag 0.8s infinite ease-in-out; font-weight: bold; }
        @keyframes pulseTag { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
        .prog-bar-row { display: flex; width: 100%; gap: 12px; padding: 4px 10px; box-sizing: border-box; align-items: center; }
        .prog-label { font-size: 10px; font-weight: bold; color: #666; min-width: 28px; text-align: center; white-space: nowrap; }
        .p-half { flex: 1; height: 10px; background: #EEE; border-radius: 5px; overflow: hidden; border: 1px solid #DDD; position: relative; }
        .p-fill { height: 100%; width: 0%; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); border-radius: 5px; position: relative; }
        .p-fill::after { content:''; position:absolute; right:0; top:0; width:100%; height:100%; background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.5) 50%, transparent 100%); animation:shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { transform:translateX(-100%); } 100% { transform:translateX(200%); } }
        #f-L { background: #55E6C1; } #f-R { background: #FFD93D; }

        #solo-container { display: none; width: 100vw; height: 100vh; padding-top: 60px; box-sizing: border-box; background: var(--bg-S); flex-direction: column; position: relative; }
        #dual-container { display: none; width: 100vw; height: 100vh; padding-top: 72px; box-sizing: border-box; gap: 4px; }
        .player-side { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: 30px 30px 0 0; margin: 0 2px; min-width: 0; }
        #side-L { background: var(--bg-L); } #side-R { background: var(--bg-R); }

        .overlay { position: absolute; inset: 0; background: rgba(255,255,255,0.97); z-index: 1500; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(4px); }
        .btn { padding: 14px 28px; font-size: 18px; font-weight: bold; border-radius: 40px; border: none; cursor: pointer; margin: 8px; color: white; width: 80%; max-width: 280px; transition: 0.15s; font-family: var(--font); letter-spacing: 1px; position: relative; overflow: hidden; box-shadow: 0 5px 0 rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-s { background: #4CAF50; } .btn-h { background: #FF9800; } .btn-back { background: #78909C; }

        .report-card { width: 100%; background: #F9F9F9; border-radius: 15px; padding: 15px; border: 2px solid #EEE; margin: 12px 0; max-height: 38%; overflow-y: auto; text-align: left; font-size: 13px; box-sizing: border-box; }
        .mistake-item { margin-bottom: 5px; color: #555; display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: #FFF; border-radius: 8px; border: 1px solid #F0F0F0; font-size: 12px; }
        .mistake-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.15); flex-shrink: 0; }
        .mistake-arrow { color: #F44336; font-weight: bold; flex-shrink: 0; }

        .drop-grid { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 14px; padding: 10px; min-height: 100px; }
        #solo-container .drop-grid { gap: 18px; }
        .belly { width: 95px; height: 95px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: white; border: 5px solid rgba(255,255,255,0.8); box-shadow: 0 6px 14px rgba(0,0,0,0.1), inset 0 -4px 8px rgba(0,0,0,0.08); animation: float 3s infinite ease-in-out; text-shadow: 0 2px 3px rgba(0,0,0,0.2); position: relative; transition: transform 0.2s, box-shadow 0.2s; }
        #solo-container .belly { width: 110px; height: 110px; font-size: 24px; }
        .belly.highlight-match { animation: pulseMatch 0.4s ease-out; box-shadow: 0 0 0 8px rgba(76,175,80,0.5), 0 6px 14px rgba(0,0,0,0.1); }
        @keyframes pulseMatch { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .ball-pit { height: 160px; background: rgba(255,255,255,0.5); border-top: 3px dashed #FFCCD5; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; padding: 14px; box-sizing: border-box; position: relative; min-height: 90px; }
        #solo-container .ball-pit { height: 190px; gap: 16px; border-top-color: #CE93D8; }
        .ball-pit::before { content: '↓ 拖放球到正確顏色的肚子 ↓'; position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #999; white-space: nowrap; pointer-events: none; }
        .ball { width: 58px; height: 58px; border-radius: 50%; border: 4px solid white; box-shadow: 0 5px 10px rgba(0,0,0,0.15), inset 0 -3px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; position: relative; z-index: 10; will-change: transform; touch-action: none; }
        #solo-container .ball { width: 68px; height: 68px; border-width: 5px; }
        .ball:active { transform: scale(1.1); box-shadow: 0 8px 18px rgba(0,0,0,0.25); z-index: 1000; }
        .ball.dragging { z-index: 1000; box-shadow: 0 12px 24px rgba(0,0,0,0.3); }

        .fb-pop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 1000; font-size: 120px; pointer-events: none; animation: popIn 0.35s ease-out; }
        #solo-container .fb-pop { font-size: 150px; }
        @keyframes popIn { 0% { transform: scale(0.3); opacity:0; } 60% { transform: scale(1.25); opacity:1; } 100% { transform: scale(1); opacity:0.8; } }
        .trophy { font-size: 70px; animation: scaleBounce 0.6s infinite alternate; }
        @keyframes scaleBounce { from { transform: scale(1); } to { transform: scale(1.12); } }

        .challenge-banner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #FF6B6B, #FF8E53); color: white; padding: 12px 24px;
            border-radius: 30px; font-size: 16px; font-weight: bold; z-index: 1600; pointer-events: none;
            animation: bannerIn 0.5s ease-out, floatBanner 2s infinite ease-in-out;
            box-shadow: 0 8px 25px rgba(255,107,107,0.5); text-align: center; white-space: nowrap;
        }
        @keyframes bannerIn { 0% { transform: translate(-50%, -50%) scale(0); opacity:0; } 100% { transform: translate(-50%, -50%) scale(1); opacity:1; } }
        @keyframes floatBanner { 0%,100% { transform: translate(-50%, -50%) translateY(0); } 50% { transform: translate(-50%, -50%) translateY(-8px); } }

        @media (max-width: 480px) {
            .belly { width: 68px; height: 68px; font-size: 15px; border-width: 4px; }
            #solo-container .belly { width: 78px; height: 78px; font-size: 17px; }
            .ball { width: 44px; height: 44px; border-width: 3px; }
            #solo-container .ball { width: 50px; height: 50px; border-width: 4px; }
            .ball-pit { height: 125px; } #solo-container .ball-pit { height: 145px; }
        }
    </style>
</head>
<body>

<div id="mode-select">
    <h1>🎨 繽紛顏色挑戰</h1>
    <p class="mode-subtitle">選擇適合的練習模式</p>
    <div class="mode-card-row">
        <div class="mode-card solo" onclick="startSoloMode()">
            <div class="icon">🧑‍🎨</div>
            <h3>單人模式</h3>
            <p>無限練習<br>自由選擇難度<br>無時間壓力</p>
        </div>
        <div class="mode-card dual" onclick="startDualMode()">
            <div class="icon">👫</div>
            <h3>雙人模式</h3>
            <p>分屏競速<br>60秒挑戰5關<br>各自獨立計分</p>
        </div>
    </div>
</div>

<div id="solo-header">
    <div class="solo-info">
        <span>🧑‍🎨 單人練習</span>
        <span class="badge badge-easy" id="solo-badge">簡單</span>
        <span>｜ 🔄 輪數：<b id="solo-rounds">0</b></span>
        <span>｜ ❌ 錯誤：<b id="solo-errors">0</b></span>
    </div>
    <button class="btn-end" onclick="endSoloPractice()">結束練習</button>
</div>

<div id="dual-header">
    <div class="timer-row">
        <span class="status-tag status-waiting" id="tag-L">🦁 學生A</span>
        <span class="timer-val">⏱️ <span id="timer">60</span>s</span>
        <span class="status-tag status-waiting" id="tag-R">🐬 學生B</span>
    </div>
    <div class="prog-bar-row">
        <span class="prog-label" id="prog-label-L">0/5</span>
        <div class="p-half"><div id="f-L" class="p-fill"></div></div>
        <div class="p-half"><div id="f-R" class="p-fill"></div></div>
        <span class="prog-label" id="prog-label-R">0/5</span>
    </div>
</div>

<div id="solo-container">
    <div id="menu-S" class="overlay">
        <div style="font-size: 60px;">🧑‍🎨</div>
        <h3>單人無限練習</h3>
        <p style="color:#888;font-size:13px;">選擇難度後開始，完成3輪後觸發挑戰題</p>
        <button class="btn btn-s" onclick="setupSolo('s')">🌟 簡單 (2肚子/3球)</button>
        <button class="btn btn-h" onclick="setupSolo('h')">🔥 進階 (4肚子/6球)</button>
        <button class="btn btn-back" onclick="backToModeSelect()">↩ 返回</button>
    </div>
    <div id="res-S" class="overlay" style="display:none">
        <div id="icon-S" class="trophy">📋</div>
        <h2 id="title-S">練習成果</h2>
        <div id="report-S" class="report-card"></div>
        <button class="btn btn-s" onclick="restartSoloSame()">🔄 相同難度再來</button>
        <button class="btn btn-h" onclick="restartSoloChange()">🔀 更換難度</button>
        <button class="btn btn-back" onclick="backToModeSelect()">↩ 返回</button>
    </div>
    <div id="grid-S" class="drop-grid"></div>
    <div id="pit-S" class="ball-pit"></div>
    <div id="fb-S" class="fb-pop"></div>
</div>

<div id="dual-container">
    <div id="side-L" class="player-side">
        <div id="menu-L" class="overlay">
            <div style="font-size: 50px;">🦁</div>
            <h3>學生 A 挑戰</h3>
            <button class="btn btn-s" onclick="setupDual('L','s')">🌟 簡單</button>
            <button class="btn btn-h" onclick="setupDual('L','h')">🔥 進階</button>
        </div>
        <div id="res-L" class="overlay" style="display:none">
            <div id="icon-L" class="trophy">🏆</div>
            <h2 id="title-L">成果表</h2>
            <div id="report-L" class="report-card"></div>
            <button class="btn btn-s" onclick="location.reload()">🔄 再玩一次</button>
            <button class="btn btn-back" onclick="backToModeSelect()">↩ 返回</button>
        </div>
        <div id="grid-L" class="drop-grid"></div>
        <div id="pit-L" class="ball-pit"></div>
        <div id="fb-L" class="fb-pop"></div>
    </div>
    <div id="side-R" class="player-side">
        <div id="menu-R" class="overlay">
            <div style="font-size: 50px;">🐬</div>
            <h3>學生 B 挑戰</h3>
            <button class="btn btn-s" onclick="setupDual('R','s')">🌟 簡單</button>
            <button class="btn btn-h" onclick="setupDual('R','h')">🔥 進階</button>
        </div>
        <div id="res-R" class="overlay" style="display:none">
            <div id="icon-R" class="trophy">🏆</div>
            <h2 id="title-R">成果表</h2>
            <div id="report-R" class="report-card"></div>
            <button class="btn btn-s" onclick="location.reload()">🔄 再玩一次</button>
            <button class="btn btn-back" onclick="backToModeSelect()">↩ 返回</button>
        </div>
        <div id="grid-R" class="drop-grid"></div>
        <div id="pit-R" class="ball-pit"></div>
        <div id="fb-R" class="fb-pop"></div>
    </div>
</div>

<script>
    (function() {
        // 基本四色（紅、黃、藍、綠）
        const baseColors = [
            { n: '紅', v: '#FF5E57' },
            { n: '黃', v: '#F7D794' },
            { n: '藍', v: '#1B9CFC' },
            { n: '綠', v: '#55E6C1' }
        ];
        // 進階挑戰5色（基本四色 + 橙色）
        const advancedColors = [
            ...baseColors,
            { n: '橙', v: '#FF9800' }
        ];

        let currentMode = null;
        const MAX_ROUNDS_DUAL = 5;
        const CHALLENGE_TRIGGER_SOLO = 3;
        const CHALLENGE_TRIGGER_DUAL = 5;

        let stats = {
            L: { s:0, m:[], mode:'', fin:false, started:false, inChallenge:false },
            R: { s:0, m:[], mode:'', fin:false, started:false, inChallenge:false }
        };
        let timeLeft = 60, timerOn = false, timerInterval = null;

        let soloStats = { rounds:0, errors:0, mode:'', started:false, totalMistakes:[], inChallenge:false };

        // 音效
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function sfx(type) {
            try {
                const ctx = getAudioCtx(), now = ctx.currentTime;
                if (type === 'win') {
                    [523,659,784].forEach((freq,i) => {
                        const o=ctx.createOscillator(), g=ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.type='triangle'; o.frequency.setValueAtTime(freq, now+i*0.1);
                        g.gain.setValueAtTime(0.3, now+i*0.1); g.gain.exponentialRampToValueAtTime(0.01, now+i*0.1+0.2);
                        o.start(now+i*0.1); o.stop(now+i*0.1+0.25);
                    });
                    return;
                }
                const o=ctx.createOscillator(), g=ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                if (type==='ok') {
                    o.type='sine'; o.frequency.setValueAtTime(523,now); o.frequency.exponentialRampToValueAtTime(880,now+0.12);
                    g.gain.setValueAtTime(0.35,now); g.gain.exponentialRampToValueAtTime(0.01,now+0.25);
                } else {
                    o.type='square'; o.frequency.setValueAtTime(220,now); o.frequency.linearRampToValueAtTime(110,now+0.2);
                    g.gain.setValueAtTime(0.25,now); g.gain.exponentialRampToValueAtTime(0.01,now+0.3);
                }
                o.start(now); o.stop(now+0.35);
            } catch(e){}
        }

        function pickRandom(arr, n) {
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, n);
        }

        function getChallengeColors(mode) {
            if (mode === 'h') return advancedColors;
            else return pickRandom(baseColors, 3);
        }

        window.startSoloMode = () => {
            currentMode = 'solo';
            document.getElementById('mode-select').style.display = 'none';
            document.getElementById('solo-header').style.display = 'flex';
            document.getElementById('solo-container').style.display = 'flex';
            document.getElementById('dual-header').style.display = 'none';
            document.getElementById('dual-container').style.display = 'none';
            resetSoloState();
            document.getElementById('menu-S').style.display = 'flex';
            document.getElementById('res-S').style.display = 'none';
            updateSoloUI();
        };
        window.startDualMode = () => {
            currentMode = 'dual';
            document.getElementById('mode-select').style.display = 'none';
            document.getElementById('dual-header').style.display = 'flex';
            document.getElementById('dual-container').style.display = 'flex';
            document.getElementById('solo-header').style.display = 'none';
            document.getElementById('solo-container').style.display = 'none';
            resetDualState();
            updateDualUI();
        };
        window.backToModeSelect = () => {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            timerOn = false; timeLeft = 60;
            resetDualState(); resetSoloState();
            document.getElementById('solo-container').style.display = 'none';
            document.getElementById('dual-container').style.display = 'none';
            document.getElementById('solo-header').style.display = 'none';
            document.getElementById('dual-header').style.display = 'none';
            document.getElementById('mode-select').style.display = 'flex';
            currentMode = null;
        };

        function resetDualState() {
            stats = {
                L: { s:0,m:[],mode:'',fin:false,started:false,inChallenge:false },
                R: { s:0,m:[],mode:'',fin:false,started:false,inChallenge:false }
            };
            timeLeft=60; timerOn=false; if(timerInterval){clearInterval(timerInterval); timerInterval=null;}
            ['L','R'].forEach(s => {
                document.getElementById('menu-'+s).style.display='flex';
                document.getElementById('res-'+s).style.display='none';
                document.getElementById('grid-'+s).innerHTML='';
                document.getElementById('pit-'+s).innerHTML='';
            });
            updateDualUI();
        }
        function resetSoloState() {
            soloStats = { rounds:0, errors:0, mode:'', started:false, totalMistakes:[], inChallenge:false };
            document.getElementById('grid-S').innerHTML = '';
            document.getElementById('pit-S').innerHTML = '';
        }

        function updateDualUI() { updateDualStatusTag('L'); updateDualStatusTag('R'); updateDualProgressBar('L'); updateDualProgressBar('R'); updateDualTimerDisplay(); }
        function updateDualStatusTag(side) {
            const tag = document.getElementById('tag-'+side);
            if (!tag) return;
            if (stats[side].fin) { tag.textContent = (side==='L'?'🦁 學生A':'🐬 學生B')+' ✅'; tag.className='status-tag status-done'; }
            else if (stats[side].inChallenge) { tag.textContent = (side==='L'?'🦁 學生A':'🐬 學生B')+' 🚀'; tag.className='status-tag status-challenge'; }
            else if (stats[side].started) { tag.textContent = (side==='L'?'🦁 學生A':'🐬 學生B')+' 🎯'; tag.className='status-tag status-playing'; }
            else { tag.textContent = (side==='L'?'🦁 學生A':'🐬 學生B'); tag.className='status-tag status-waiting'; }
        }
        function updateDualProgressBar(side) {
            document.getElementById('f-'+side).style.width = (stats[side].s/MAX_ROUNDS_DUAL)*100+'%';
            document.getElementById('prog-label-'+side).textContent = stats[side].s+'/'+MAX_ROUNDS_DUAL;
        }
        function updateDualTimerDisplay() {
            const el = document.getElementById('timer');
            if (!el) return;
            el.textContent = timeLeft;
            el.style.color = timeLeft<=10 ? '#F44336' : (timeLeft<=20 ? '#FF9800' : '#FF6B6B');
        }
        function startDualClock() {
            if (timerOn) return;
            timerOn = true; updateDualTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--; updateDualTimerDisplay();
                if (timeLeft<=0) { clearInterval(timerInterval); timerInterval=null; finishAllDual(); }
                if (stats.L.fin && stats.R.fin) { clearInterval(timerInterval); timerInterval=null; }
            }, 1000);
        }
        window.setupDual = (side, mode) => {
            if (stats[side].started || stats[side].fin || timeLeft<=0) return;
            stats[side].mode = mode; stats[side].started = true; stats[side].inChallenge = false;
            document.getElementById('menu-'+side).style.display = 'none';
            updateDualStatusTag(side); updateDualProgressBar(side);
            if (!timerOn) startDualClock();
            loadDualLevel(side);
        };
        function loadDualLevel(side) {
            if (stats[side].fin || timeLeft<=0) return;
            const grid = document.getElementById('grid-'+side), pit = document.getElementById('pit-'+side);
            grid.innerHTML = ''; pit.innerHTML = '';

            const isChallenge = stats[side].inChallenge;
            let colorSet, numBelly, numBall;
            if (isChallenge) {
                colorSet = getChallengeColors(stats[side].mode);
                numBelly = colorSet.length;
                numBall = numBelly + 1;
            } else {
                colorSet = baseColors;
                numBelly = stats[side].mode === 'h' ? 4 : 2;
                numBall = stats[side].mode === 'h' ? 6 : 3;
            }

            const curColors = pickRandom(colorSet, numBelly);
            curColors.forEach(c => {
                const bellyDiv = document.createElement('div');
                bellyDiv.className = 'belly'; bellyDiv.dataset.v = c.v; bellyDiv.dataset.n = c.n;
                bellyDiv.style.background = c.v; bellyDiv.textContent = c.n;
                grid.appendChild(bellyDiv);
            });
            const ballColors = [];
            for (let i=0; i<numBall; i++) ballColors.push(curColors[i % curColors.length]);
            ballColors.sort(() => 0.5 - Math.random());
            ballColors.forEach(c => {
                const ballDiv = document.createElement('div');
                ballDiv.className = 'ball'; ballDiv.style.background = c.v; ballDiv.dataset.v = c.v; ballDiv.dataset.n = c.n;
                pit.appendChild(ballDiv);
                attachDrag(ballDiv, 'side-'+side, 'dual');
            });
        }
        function checkDualLevelComplete(side) {
            if (!document.querySelector(`#side-${side} .ball`)) {
                stats[side].s++;
                updateDualProgressBar(side);
                if (stats[side].s === CHALLENGE_TRIGGER_DUAL && !stats[side].inChallenge) {
                    stats[side].inChallenge = true;
                    updateDualStatusTag(side);
                    showChallengeBanner('side-'+side);
                    setTimeout(() => loadDualLevel(side), 1500);
                } else if (stats[side].s >= MAX_ROUNDS_DUAL && stats[side].inChallenge) {
                    stats[side].fin = true; sfx('win'); updateDualStatusTag(side); showDualResult(side,true);
                    if (stats.L.fin && stats.R.fin && timerInterval) { clearInterval(timerInterval); timerInterval=null; }
                } else if (stats[side].s < MAX_ROUNDS_DUAL) {
                    setTimeout(() => loadDualLevel(side), 350);
                } else {
                    stats[side].fin = true; sfx('win'); updateDualStatusTag(side); showDualResult(side,true);
                }
            }
        }
        function showChallengeBanner(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const banner = document.createElement('div');
            banner.className = 'challenge-banner';
            banner.textContent = '🚀 挑戰題！更多顏色';
            container.appendChild(banner);
            setTimeout(() => { if (banner.parentNode) banner.remove(); }, 1500);
        }
        function showDualResult(side, win) {
            document.getElementById('res-'+side).style.display='flex';
            document.getElementById('icon-'+side).textContent = win?'🏆':'⏰';
            document.getElementById('title-'+side).textContent = win?'🎉 恭喜完成！':'時間到！';
            let html = `<p>📊 完成：${stats[side].s}/${MAX_ROUNDS_DUAL} | ❌ 錯誤：${stats[side].m.length}次</p><hr>`;
            if (stats[side].m.length) {
                html += '<b>需注意的顏色：</b><br>';
                stats[side].m.forEach(e => html += `<div class="mistake-item"><span class="mistake-dot" style="background:${e.bc}"></span>${e.bv}球 ➔ <span class="mistake-dot" style="background:${e.tc}"></span>${e.tv}肚子 ❌</div>`);
            } else html += '<p style="color:green">🌟 完美！</p>';
            document.getElementById('report-'+side).innerHTML = html;
        }
        function finishAllDual() {
            if (!stats.L.fin) { stats.L.fin=true; showDualResult('L',false); }
            if (!stats.R.fin) { stats.R.fin=true; showDualResult('R',false); }
        }

        // 單人模式邏輯
        function updateSoloUI() {
            document.getElementById('solo-rounds').textContent = soloStats.rounds;
            document.getElementById('solo-errors').textContent = soloStats.errors;
            const badge = document.getElementById('solo-badge');
            if (soloStats.inChallenge) {
                badge.textContent = '挑戰'; badge.className = 'badge badge-challenge';
            } else if (soloStats.mode === 'h') {
                badge.textContent = '進階'; badge.className = 'badge badge-hard';
            } else {
                badge.textContent = '簡單'; badge.className = 'badge badge-easy';
            }
        }
        window.setupSolo = (mode) => {
            if (soloStats.started) return;
            soloStats.mode = mode; soloStats.started = true; soloStats.rounds = 0; soloStats.errors = 0;
            soloStats.totalMistakes = []; soloStats.inChallenge = false;
            document.getElementById('menu-S').style.display = 'none';
            document.getElementById('res-S').style.display = 'none';
            updateSoloUI();
            loadSoloLevel();
        };
        function loadSoloLevel() {
            if (!soloStats.started) return;
            const grid = document.getElementById('grid-S'), pit = document.getElementById('pit-S');
            grid.innerHTML = ''; pit.innerHTML = '';

            const isChallenge = soloStats.inChallenge;
            let colorSet, numBelly, numBall;
            if (isChallenge) {
                colorSet = getChallengeColors(soloStats.mode);
                numBelly = colorSet.length;
                numBall = numBelly + 1;
            } else {
                colorSet = baseColors;
                numBelly = soloStats.mode === 'h' ? 4 : 2;
                numBall = soloStats.mode === 'h' ? 6 : 3;
            }

            const curColors = pickRandom(colorSet, numBelly);
            curColors.forEach(c => {
                const bellyDiv = document.createElement('div');
                bellyDiv.className = 'belly'; bellyDiv.dataset.v = c.v; bellyDiv.dataset.n = c.n;
                bellyDiv.style.background = c.v; bellyDiv.textContent = c.n;
                grid.appendChild(bellyDiv);
            });
            const ballColors = [];
            for (let i=0; i<numBall; i++) ballColors.push(curColors[i % curColors.length]);
            ballColors.sort(() => 0.5 - Math.random());
            ballColors.forEach(c => {
                const ballDiv = document.createElement('div');
                ballDiv.className = 'ball'; ballDiv.style.background = c.v; ballDiv.dataset.v = c.v; ballDiv.dataset.n = c.n;
                pit.appendChild(ballDiv);
                attachDrag(ballDiv, 'solo-container', 'solo');
            });
        }
        function checkSoloLevelComplete() {
            if (!document.querySelector('#solo-container .ball')) {
                soloStats.rounds++; updateSoloUI(); sfx('win');
                if (soloStats.rounds === CHALLENGE_TRIGGER_SOLO && !soloStats.inChallenge) {
                    soloStats.inChallenge = true; updateSoloUI();
                    showChallengeBanner('solo-container');
                    setTimeout(() => { if (soloStats.started) loadSoloLevel(); }, 1500);
                } else {
                    setTimeout(() => { if (soloStats.started) loadSoloLevel(); }, 500);
                }
            }
        }
        window.endSoloPractice = () => { if (!soloStats.started) return; soloStats.started = false; showSoloResult(); };
        window.restartSoloSame = () => {
            const mode = soloStats.mode; resetSoloState();
            document.getElementById('menu-S').style.display='none'; document.getElementById('res-S').style.display='none';
            soloStats.mode=mode; soloStats.started=true; soloStats.rounds=0; soloStats.errors=0;
            soloStats.totalMistakes=[]; soloStats.inChallenge=false;
            updateSoloUI(); loadSoloLevel();
        };
        window.restartSoloChange = () => { resetSoloState(); document.getElementById('menu-S').style.display='flex'; document.getElementById('res-S').style.display='none'; };
        function showSoloResult() {
            document.getElementById('res-S').style.display='flex'; document.getElementById('menu-S').style.display='none';
            document.getElementById('grid-S').innerHTML=''; document.getElementById('pit-S').innerHTML='';
            const diff = soloStats.mode==='h'?'🔥 進階':'🌟 簡單';
            let html = `<p>🎯 難度：${diff}</p><p>🔄 完成輪數：<b>${soloStats.rounds}</b></p><p>❌ 總錯誤：<b>${soloStats.errors}</b></p><hr>`;
            if (soloStats.totalMistakes.length) {
                html += '<b>錯誤記錄：</b><br>';
                soloStats.totalMistakes.forEach(e => html += `<div class="mistake-item"><span class="mistake-dot" style="background:${e.bc}"></span>${e.bv}球 ➔ <span class="mistake-dot" style="background:${e.tc}"></span>${e.tv}肚子 ❌</div>`);
            } else if (soloStats.rounds>0) html += '<p style="color:green">🌟 完美！</p>';
            else html += '<p>尚未完成任何一輪</p>';
            document.getElementById('report-S').innerHTML = html;
        }

        // 核心：拖拽事件綁定到各自容器，避免分屏衝突
        function attachDrag(el, containerId, gameType) {
            let startX, startY, isDragging = false, pointerId = null;
            const sideForDual = containerId.replace('side-','');
            const container = document.getElementById(containerId);

            const onStart = (e) => {
                if (gameType==='dual' && (timeLeft<=0 || stats[sideForDual].fin)) return;
                if (gameType==='solo' && !soloStats.started) return;
                if (isDragging) return;
                e.preventDefault();
                const pt = e.touches ? e.changedTouches[0] : e;
                if (!pt) return;
                isDragging = true; pointerId = e.touches ? pt.identifier : 'mouse';
                const rect = el.getBoundingClientRect();
                startX = pt.clientX; startY = pt.clientY;
                el.classList.add('dragging'); el.style.transition='none'; el.style.zIndex=1000;
            };

            const onMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                let pt = null;
                if (e.touches) {
                    for (let i=0;i<e.touches.length;i++) if (e.touches[i].identifier===pointerId) { pt=e.touches[i]; break; }
                    if (!pt) return;
                } else pt = e;
                const dx = pt.clientX - startX, dy = pt.clientY - startY;
                el.style.transform = `translate(${dx}px, ${dy}px) scale(1.15)`;
            };

            const onEnd = (e) => {
                if (!isDragging) return;
                if (e.changedTouches) {
                    let found = false;
                    for (let i=0;i<e.changedTouches.length;i++) if (e.changedTouches[i].identifier===pointerId) { found=true; break; }
                    if (!found) return;
                }
                isDragging = false; pointerId = null;
                el.classList.remove('dragging'); el.style.zIndex=10;
                const ballRect = el.getBoundingClientRect();
                let hit = null;
                document.querySelectorAll(`#${containerId} .belly`).forEach(belly => {
                    const r = belly.getBoundingClientRect();
                    const overlapX = Math.max(0, Math.min(ballRect.right,r.right)-Math.max(ballRect.left,r.left));
                    const overlapY = Math.max(0, Math.min(ballRect.bottom,r.bottom)-Math.max(ballRect.top,r.top));
                    if (overlapX*overlapY > ballRect.width*ballRect.height*0.3) hit = belly;
                });
                if (hit) {
                    if (hit.dataset.v === el.dataset.v) {
                        sfx('ok');
                        showFeedback(gameType==='solo'?'S':sideForDual, '✅','#4CAF50');
                        hit.classList.add('highlight-match');
                        setTimeout(()=>hit.classList.remove('highlight-match'),400);
                        el.style.transition='transform 0.2s, opacity 0.2s';
                        el.style.transform='scale(0.3)'; el.style.opacity='0';
                        cleanup();
                        setTimeout(() => {
                            if (el.parentNode) el.remove();
                            if (gameType==='solo') checkSoloLevelComplete();
                            else checkDualLevelComplete(sideForDual);
                        },200);
                    } else {
                        sfx('no');
                        showFeedback(gameType==='solo'?'S':sideForDual, '❌','#F44336');
                        if (gameType==='solo') {
                            soloStats.errors++;
                            soloStats.totalMistakes.push({bv:el.dataset.n, bc:el.style.background, tv:hit.dataset.n, tc:hit.style.background});
                            updateSoloUI();
                        } else {
                            stats[sideForDual].m.push({bv:el.dataset.n, bc:el.style.background, tv:hit.dataset.n, tc:hit.style.background});
                        }
                        resetPos();
                    }
                } else resetPos();
            };

            const resetPos = () => {
                el.style.transition = 'transform 0.35s cubic-bezier(0.25,0.8,0.25,1.2)';
                el.style.transform = 'translate(0,0) scale(1)'; el.style.zIndex=10;
            };
            const cleanup = () => {
                el.removeEventListener('touchstart', onStart);
                el.removeEventListener('mousedown', onStart);
                if (container) {
                    container.removeEventListener('touchmove', onMove);
                    container.removeEventListener('mousemove', onMove);
                    container.removeEventListener('touchend', onEnd);
                    container.removeEventListener('mouseup', onEnd);
                    container.removeEventListener('touchcancel', onEnd);
                }
            };

            // 將移動和釋放事件綁定到對應容器，而非 window
            el.addEventListener('touchstart', onStart, {passive: false});
            el.addEventListener('mousedown', onStart);
            if (container) {
                container.addEventListener('touchmove', onMove, {passive: false});
                container.addEventListener('mousemove', onMove);
                container.addEventListener('touchend', onEnd);
                container.addEventListener('mouseup', onEnd);
                container.addEventListener('touchcancel', onEnd);
            }
        }

        function showFeedback(id, emoji, color) {
            const fb = document.getElementById('fb-'+id);
            if (!fb) return;
            fb.textContent=emoji; fb.style.color=color; fb.style.display='flex';
            fb.style.animation='none'; void fb.offsetWidth; fb.style.animation='popIn 0.35s ease-out';
            clearTimeout(fb._timeout); fb._timeout=setTimeout(()=>fb.style.display='none',500);
        }

        document.getElementById('mode-select').style.display='flex';
    })();
</script>
