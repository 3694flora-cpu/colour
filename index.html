<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>繽紛顏色挑戰 - 教學加強版</title>
    <style>
        :root { 
            --bg-L: #E3F2FD; --bg-R: #FFF9C4; 
            --font: 'Comic Sans MS', 'Microsoft JhengHei', cursive, sans-serif; 
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font); overflow: hidden; background: #FFEDF0; touch-action: none; user-select: none; }
        
        /* 頂部計時欄 */
        .timer-header { position: absolute; top: 0; width: 100%; height: 70px; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; border-bottom: 4px solid #FFCCD5; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .timer-val { font-size: 24px; font-weight: bold; color: #FF6B6B; background: #FFF5F7; padding: 5px 20px; border-radius: 20px; border: 2px solid #FFCCD5; }
        .prog-bar-row { display: flex; width: 100%; gap: 10px; padding: 5px 10px; box-sizing: border-box; }
        .p-half { flex: 1; height: 10px; background: #EEE; border-radius: 5px; overflow: hidden; border: 1px solid #DDD; }
        .p-fill { height: 100%; width: 0%; transition: width 0.4s; }
        #f-L { background: #55E6C1; } #f-R { background: #FFD93D; }

        .split-container { display: flex; width: 100vw; height: 100vh; padding-top: 70px; box-sizing: border-box; gap: 4px; }
        .player-side { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: 30px 30px 0 0; margin: 0 2px; }
        #side-L { background: var(--bg-L); } #side-R { background: var(--bg-R); }

        /* 選單與成果表 (Overlay) */
        .overlay { position: absolute; inset: 0; background: rgba(255,255,255,0.98); z-index: 1500; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 25px; }
        .btn { padding: 15px 30px; font-size: 20px; font-weight: bold; border-radius: 40px; border: none; cursor: pointer; margin: 10px; color: white; width: 85%; transition: 0.2s; }
        .btn-s { background: #4CAF50; box-shadow: 0 5px 0 #2E7D32; }
        .btn-h { background: #2196F3; box-shadow: 0 5px 0 #1565C0; }
        .btn:active { transform: translateY(4px); box-shadow: none; }

        /* 成果表樣式 */
        .report-card { width: 100%; background: #F9F9F9; border-radius: 15px; padding: 15px; border: 2px solid #EEE; margin: 15px 0; max-height: 40%; overflow-y: auto; text-align: left; font-size: 14px; }
        .mistake-item { margin-bottom: 5px; color: #555; display: flex; align-items: center; gap: 5px; }

        /* 遊戲核心元素 */
        .drop-grid { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 15px; padding: 10px; }
        .belly { width: 110px; height: 110px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; color: white; border: 6px solid rgba(255,255,255,0.8); box-shadow: 0 6px 12px rgba(0,0,0,0.1); animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        
        .ball-pit { height: 180px; background: rgba(255,255,255,0.5); border-top: 3px dashed #FFCCD5; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; padding: 15px; }
        .ball { width: 65px; height: 65px; border-radius: 50%; border: 5px solid white; box-shadow: 0 5px 10px rgba(0,0,0,0.15); cursor: pointer; }

        .fb-pop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 1000; font-size: 150px; pointer-events: none; }
        .trophy { font-size: 80px; animation: scale 0.5s infinite alternate; }
        @keyframes scale { from { transform: scale(1); } to { transform: scale(1.15); } }
    </style>
</head>
<body>

<div class="timer-header">
    <div class="timer-val">⏱️ <span id="timer">60</span>s</div>
    <div class="prog-bar-row">
        <div class="p-half"><div id="f-L" class="p-fill"></div></div>
        <div class="p-half"><div id="f-R" class="p-fill"></div></div>
    </div>
</div>

<div class="split-container">
    <div id="side-L" class="player-side">
        <div id="menu-L" class="overlay">
            <div style="font-size: 60px;">🦁</div>
            <h3>學生 A 挑戰</h3>
            <button class="btn btn-s" onclick="setup('L','s')">簡單 (2肚子/3球)</button>
            <button class="btn btn-h" onclick="setup('L','h')">進階 (4肚子/6球)</button>
        </div>
        <div id="res-L" class="overlay" style="display:none">
            <div id="icon-L" class="trophy">🏆</div>
            <h2 id="title-L">成果表</h2>
            <div id="report-L" class="report-card"></div>
            <button class="btn btn-s" onclick="location.reload()">再玩一次</button>
        </div>
        <div id="grid-L" class="drop-grid"></div>
        <div id="pit-L" class="ball-pit"></div>
        <div id="fb-L" class="fb-pop"></div>
    </div>

    <div id="side-R" class="player-side">
        <div id="menu-R" class="overlay">
            <div style="font-size: 60px;">🐬</div>
            <h3>學生 B 挑戰</h3>
            <button class="btn btn-s" onclick="setup('R','s')">簡單 (2肚子/3球)</button>
            <button class="btn btn-h" onclick="setup('R','h')">進階 (4肚子/6球)</button>
        </div>
        <div id="res-R" class="overlay" style="display:none">
            <div id="icon-R" class="trophy">🏆</div>
            <h2 id="title-R">成果表</h2>
            <div id="report-R" class="report-card"></div>
            <button class="btn btn-s" onclick="location.reload()">再玩一次</button>
        </div>
        <div id="grid-R" class="drop-grid"></div>
        <div id="pit-R" class="ball-pit"></div>
        <div id="fb-R" class="fb-pop"></div>
    </div>
</div>

<script>
    const colors = [{n:'紅',v:'#FF5E57'},{n:'藍',v:'#1B9CFC'},{n:'綠',v:'#55E6C1'},{n:'黃',v:'#F7D794'}];
    let stats = { L:{s:0, m:[], mode:'', fin:false}, R:{s:0, m:[], mode:'', fin:false} };
    let timeLeft = 60, timerOn = false;

    // 聲效系統
    function sfx(type) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        if(type==='ok'){ o.frequency.setValueAtTime(523,ctx.currentTime); o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.1); }
        else { o.frequency.setValueAtTime(220,ctx.currentTime); o.frequency.linearRampToValueAtTime(110,ctx.currentTime+0.2); }
        g.gain.fadeOut=0.2; o.start(); o.stop(ctx.currentTime+0.2);
    }

    function setup(side, mode) {
        stats[side].mode = mode;
        document.getElementById('menu-'+side).style.display = 'none';
        if(!timerOn) { timerOn=true; startClock(); }
        loadLevel(side);
    }

    function startClock() {
        const t = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if(timeLeft <= 0) { clearInterval(t); finishAll(); }
            if(stats.L.fin && stats.R.fin) clearInterval(t);
        }, 1000);
    }

    function loadLevel(s) {
        if(stats[s].fin || timeLeft <= 0) return;
        const g = document.getElementById('grid-'+s), p = document.getElementById('pit-'+s);
        g.innerHTML = ''; p.innerHTML = '';
        
        const numB = (stats[s].mode === 'h') ? 4 : 2;
        const numP = (stats[s].mode === 'h') ? 6 : 3;
        const cur = [...colors].sort(()=>0.5-Math.random()).slice(0, numB);

        cur.forEach(c => g.innerHTML += `<div class="belly" data-v="${c.v}" style="background:${c.v}">${c.n}</div>`);
        for(let i=0; i<numP; i++) {
            const c = cur[i % cur.length];
            const b = document.createElement('div');
            b.className = 'ball'; b.style.background = c.v; b.dataset.v = c.v; b.dataset.n = c.n;
            p.appendChild(b); drag(b, s);
        }
    }

    function drag(el, s) {
        let x=0, y=0, ox=0, oy=0, act=false;
        const ts = (e) => { if(timeLeft<=0) return; act=true; const t=e.touches?e.touches[0]:e; ox=t.clientX-x; oy=t.clientY-y; el.style.zIndex=1000; };
        const tm = (e) => { if(!act) return; e.preventDefault(); const t=e.touches?e.touches[0]:e; x=t.clientX-ox; y=t.clientY-oy; el.style.transform=`translate(${x}px,${y}px) scale(1.2)`; };
        const te = () => {
            if(!act) return; act=false;
            const r1 = el.getBoundingClientRect(); let hit = false;
            document.querySelectorAll(`#side-${s} .belly`).forEach(b => {
                const r2 = b.getBoundingClientRect();
                if(!(r1.right<r2.left || r1.left>r2.right || r1.bottom<r2.top || r1.top>r2.bottom)) {
                    if(b.dataset.v === el.dataset.v) {
                        sfx('ok'); pop(s, '✅', '#4CAF50'); el.remove(); hit=true;
                        if(document.querySelectorAll(`#side-${s} .ball`).length === 0) {
                            stats[s].s++;
                            document.getElementById('f-'+s).style.width = (stats[s].s/5)*100+'%';
                            if(stats[s].s >= 5) { stats[s].fin=true; showResult(s, true); }
                            else loadLevel(s);
                        }
                    } else {
                        sfx('no'); pop(s, '❌', '#F44336');
                        stats[s].m.push({bv:el.dataset.n, bc:el.style.background, tv:b.innerText, tc:b.style.background});
                        resetPos();
                    }
                    hit = true;
                }
            });
            if(!hit) resetPos();
        };
        function resetPos(){ el.style.transition='transform 0.3s'; x=0; y=0; el.style.transform='translate(0,0)'; }
        el.addEventListener('touchstart', ts, {passive:false}); window.addEventListener('touchmove', tm, {passive:false}); window.addEventListener('touchend', te);
        el.addEventListener('mousedown', ts); window.addEventListener('mousemove', tm); window.addEventListener('mouseup', te);
    }

    function pop(s, t, c) {
        const o = document.getElementById('fb-'+s); o.innerText = t; o.style.color = c;
        o.style.display = 'flex'; setTimeout(()=>o.style.display='none', 500);
    }

    function showResult(s, win) {
        document.getElementById('res-'+s).style.display = 'flex';
        const rep = document.getElementById('report-'+s);
        const title = document.getElementById('title-'+s);
        const icon = document.getElementById('icon-'+s);
        
        if(!win) { icon.innerText='⏰'; title.innerText='時間到！成果表'; }
        
        let html = `<p><b>完成題數：</b> ${stats[s].s} / 5</p>`;
        html += `<p><b>錯誤次數：</b> ${stats[s].m.length} 次</p><hr>`;
        if(stats[s].m.length > 0) {
            html += `<b>需注意的顏色：</b><br>`;
            stats[s].m.forEach(err => {
                html += `<div class="mistake-item"><span style="color:${err.bc}">●</span> ${err.bv}球 ➔ <span style="color:${err.tc}">●</span> ${err.tv}肚子 ❌</div>`;
            });
        } else {
            html += `<p style="color:green">🌟 表現完美！完全正確！</p>`;
        }
        rep.innerHTML = html;
    }

    function finishAll() {
        if(!stats.L.fin) showResult('L', false);
        if(!stats.R.fin) showResult('R', false);
    }
</script>
</body>
</html>
